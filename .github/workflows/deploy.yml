name: Deploy to Plesk via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Prevent concurrent deployments from colliding
concurrency:
  group: 'deploy-production'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy Next.js Static Export
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Step 2: Set up Node.js with npm caching for fast builds
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 3: Install clean dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Build the Next.js static export (outputs to ./out/)
      - name: Build Next.js Static Export
        run: npm run build

      # Step 5: Sync built static assets to Plesk via FTP
      - name: Deploy to Plesk via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 222.165.190.235
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./out/
          server-dir: /httpdocs/

